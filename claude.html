<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b6e4f">
  <meta name="description" content="Open Claude, a virtual cardiovascular pharmacology practical simulator.">
  <title>Claude — Launcher</title>
  <style>
    :root { color-scheme: light dark; --bg:#f3f5f9; --card:#fff; --text:#0f172a; --muted:#5b6b82; --accent:#0b6e4f; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0b1020; --card:#141b2e; --text:#e8ecf5; --muted:#a3aec2; --accent:#34d399; } }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; padding:24px; display:grid; place-items:center; background:var(--bg); color:var(--text); font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
    main { width:min(100%,520px); padding:28px; border-radius:22px; background:var(--card); text-align:center; box-shadow:0 12px 36px rgba(0,0,0,.10); }
    .icon { font-size:48px; margin-bottom:10px; }
    h1 { font-size:clamp(1.4rem,5vw,2rem); line-height:1.2; margin:0 0 12px; }
    p { color:var(--muted); margin:0 0 22px; }
    .launch { display:inline-flex; justify-content:center; align-items:center; width:100%; min-height:54px; padding:14px 18px; border-radius:12px; background:var(--accent); color:#fff; text-decoration:none; font-weight:750; font-size:1rem; }
    .launch:focus-visible { outline:3px solid var(--text); outline-offset:4px; }
    .note { font-size:.82rem; margin-top:16px; margin-bottom:0; }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">🫀</div>
    <h1>Claude</h1>
    <p>Virtual cardiovascular pharmacology simulator</p>
    <a class="launch" href="dog_CAL.html">Open Claude →</a>
    <p class="note">For educational use. This is a simulated practical, not a tool for real-animal treatment.</p>
  </main>
</body>
</html>
